<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>证监会每日审批爬虫</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #081628;
      --navy: #102a43;
      --blue: #1a73e8;
      --blue-2: #0b57d0;
      --mist: #edf3f9;
      --line: rgba(16, 42, 67, 0.10);
      --muted: #5b6e82;
      --ok: #0f7a4a;
      --warn: #9a6700;
      --danger: #b42318;
      --card: rgba(255,255,255,0.86);
      --shadow: 0 24px 60px rgba(8, 22, 40, 0.12);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Noto Sans SC", "PingFang SC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 520px at 8% -8%, #cfe0f8 0%, transparent 55%),
        radial-gradient(800px 480px at 100% 0%, #d9ebe4 0%, transparent 48%),
        linear-gradient(165deg, #e8eef6 0%, #f4f7fb 42%, #e9eef5 100%);
    }
    .bg-grid {
      position: fixed; inset: 0; pointer-events: none; opacity: 0.35;
      background-image:
        linear-gradient(rgba(16,42,67,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(16,42,67,0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
    }
    .page {
      position: relative;
      width: min(1040px, calc(100% - 32px));
      margin: 0 auto;
      padding: 36px 0 56px;
    }

    /* Hero */
    .hero {
      display: grid;
      grid-template-columns: 1.25fr 0.75fr;
      gap: 28px;
      align-items: end;
      margin-bottom: 22px;
    }
    @media (max-width: 840px) {
      .hero { grid-template-columns: 1fr; gap: 16px; }
    }
    .brand {
      font-family: "Instrument Sans", "Noto Sans SC", sans-serif;
      font-weight: 700;
      letter-spacing: 0.04em;
      font-size: 13px;
      color: var(--blue-2);
      margin-bottom: 10px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 4.2vw, 42px);
      line-height: 1.15;
      font-weight: 900;
      letter-spacing: -0.03em;
      max-width: 12em;
    }
    .lead {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
      max-width: 34em;
    }
    .hero-side {
      background: linear-gradient(145deg, #102a43 0%, #1a4a7a 55%, #1a73e8 120%);
      color: #fff;
      border-radius: 20px;
      padding: 20px 22px;
      box-shadow: var(--shadow);
      min-height: 132px;
    }
    .hero-side .kicker { font-size: 12px; opacity: 0.75; margin-bottom: 8px; }
    .hero-side .big { font-size: 22px; font-weight: 800; line-height: 1.35; }
    .hero-side .small { margin-top: 10px; font-size: 12px; opacity: 0.72; }

    /* Panels */
    .panel {
      background: var(--card);
      backdrop-filter: blur(14px);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 22px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
      animation: rise .45s ease both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }
    .panel h2 {
      margin: 0 0 16px;
      font-size: 15px;
      font-weight: 800;
      color: var(--navy);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .panel h2::before {
      content: "";
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 0 0 4px rgba(26,115,232,0.15);
    }

    .field {
      display: grid;
      grid-template-columns: 96px 1fr;
      gap: 12px;
      align-items: start;
      margin-bottom: 14px;
    }
    @media (max-width: 640px) {
      .field { grid-template-columns: 1fr; gap: 6px; }
    }
    .label {
      padding-top: 10px;
      text-align: right;
      font-size: 13px;
      font-weight: 700;
      color: #40566d;
    }
    @media (max-width: 640px) { .label { text-align: left; padding-top: 0; } }

    select, input[type="date"], input[type="search"] {
      width: 100%;
      max-width: 280px;
      border: 1px solid #cfd8e3;
      border-radius: 12px;
      padding: 10px 12px;
      font: inherit;
      font-size: 13px;
      background: #fff;
      transition: border-color .15s, box-shadow .15s;
    }
    select:focus, input:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(26,115,232,0.12);
    }
    .chips {
      display: flex; flex-wrap: wrap; gap: 8px;
    }
    .chip {
      display: inline-flex; align-items: center; gap: 7px;
      border: 1px solid #d5deea;
      background: #fff;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
      transition: all .15s ease;
    }
    .chip:hover { border-color: #9db7de; }
    .chip input { accent-color: var(--blue); }
    .chip.active {
      background: #eaf2ff;
      border-color: #8eb6ef;
      color: var(--blue-2);
      font-weight: 700;
    }
    .hint { color: #8a9bb0; font-size: 12px; margin-top: 6px; }

    .bench-toolbar {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px;
    }
    .bench-toolbar input[type="search"] { max-width: none; flex: 1; min-width: 160px; }
    .mini-btn {
      border: 1px solid #d5deea;
      background: #fff;
      border-radius: 10px;
      padding: 9px 12px;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      color: #334155;
      cursor: pointer;
    }
    .mini-btn:hover { background: #f8fafc; }
    .bench-box {
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      background: linear-gradient(180deg, #fbfcfe, #f5f8fb);
      max-height: 210px;
      overflow: auto;
      padding: 12px;
    }
    .bench-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
      gap: 6px 8px;
    }
    .bench-grid label {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px; cursor: pointer;
      padding: 4px 6px; border-radius: 8px;
    }
    .bench-grid label:hover { background: rgba(26,115,232,0.06); }

    .actions {
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
      margin: 4px 0 16px;
    }
    .btn-run {
      border: none;
      border-radius: 14px;
      padding: 14px 26px;
      font: inherit;
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
      background: linear-gradient(135deg, #1a73e8 0%, #0b57d0 100%);
      box-shadow: 0 14px 30px rgba(26,115,232,0.28);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .btn-run:hover { transform: translateY(-1px); box-shadow: 0 18px 34px rgba(26,115,232,0.34); }
    .btn-run:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
    .status {
      font-size: 13px; color: var(--muted); font-weight: 600;
    }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--danger); }
    .status.run { color: var(--blue-2); }

    .log {
      min-height: 150px; max-height: 260px; overflow: auto;
      border-radius: 14px;
      background: #0b1f33;
      color: #d7e8ff;
      padding: 14px 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.55;
      white-space: pre-wrap;
    }
    .hidden { display: none !important; }
    footer {
      margin-top: 8px;
      text-align: center;
      color: #8a9bb0;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="page">
    <header class="hero">
      <div>
        <div class="brand">CSRC APPROVAL TRACKER</div>
        <h1>证监会每日审批爬虫</h1>
        <p class="lead">勾选日期与对标机构，一键从公开接口导出多 Sheet Excel。数据与官网「审批进度公示」一致，适合日常盯盘与业务汇报。</p>
      </div>
      <aside class="hero-side">
        <div class="kicker">网页版操作台</div>
        <div class="big">选日期 · 勾机构 · 下载台账</div>
        <div class="small" id="heroMeta">加载机构名单中…</div>
      </aside>
    </header>

    <section class="panel">
      <h2>爬取配置</h2>

      <div class="field">
        <div class="label">基金类型</div>
        <div>
          <select id="fundType"></select>
          <div class="hint">当前网页版按全部类型导出主台账（筛选可后续加强）</div>
        </div>
      </div>

      <div class="field">
        <div class="label">日期类型</div>
        <div>
          <div class="chips" id="dateType">
            <label class="chip active"><input type="radio" name="dtype" value="today" checked /> 今日</label>
            <label class="chip"><input type="radio" name="dtype" value="yesterday" /> 昨日</label>
            <label class="chip"><input type="radio" name="dtype" value="single" /> 单日</label>
            <label class="chip"><input type="radio" name="dtype" value="range" /> 日期范围</label>
          </div>
        </div>
      </div>

      <div class="field hidden" id="rowSingle">
        <div class="label">目标日期</div>
        <div><input type="date" id="singleDate" /></div>
      </div>

      <div class="field hidden" id="rowRange">
        <div class="label">起止日期</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
          <input type="date" id="startDate" />
          <span style="color:#8a9bb0">至</span>
          <input type="date" id="endDate" />
          <span class="hint">长区间会较慢，建议今日/昨日</span>
        </div>
      </div>

      <div class="field">
        <div class="label">对标机构</div>
        <div>
          <div class="bench-toolbar">
            <input type="search" id="benchSearch" placeholder="搜索机构，例如：易方达" />
            <button type="button" class="mini-btn" id="btnCommon">常用对标</button>
            <button type="button" class="mini-btn" id="btnClear">清空</button>
          </div>
          <div class="bench-box"><div class="bench-grid" id="benchList"></div></div>
          <div class="hint">勾选后额外生成「对标同业」Excel；对标区间与主区间一致</div>
        </div>
      </div>

      <div class="field">
        <div class="label">高级</div>
        <div>
          <label class="chip" id="etfChip"><input type="checkbox" id="etfFull" /> ETF 新主题抓全历史（很慢）</label>
        </div>
      </div>
    </section>

    <div class="actions">
      <button class="btn-run" id="btnRun">开始爬取并下载</button>
      <span class="status" id="status">就绪</span>
    </div>

    <section class="panel">
      <h2>运行日志</h2>
      <div class="log" id="log">等待开始…</div>
    </section>

    <footer>公开网页版 · 数据来源 neris.csrc.gov.cn 行政许可审批进度公示</footer>
  </div>

  <script>
    const API_BASE = window.CSRC_API_BASE || "";
    const logEl = document.getElementById("log");
    const statusEl = document.getElementById("status");
    let allInstitutions = [];
    let commonBenchmarks = [];

    function log(msg) {
      const t = new Date().toLocaleTimeString("zh-CN", { hour12: false });
      if (logEl.textContent === "等待开始…") logEl.textContent = "";
      logEl.textContent += `[${t}] ${msg}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function selectedDateType() {
      return document.querySelector('input[name="dtype"]:checked').value;
    }

    function syncDateRows() {
      const v = selectedDateType();
      document.getElementById("rowSingle").classList.toggle("hidden", v !== "single");
      document.getElementById("rowRange").classList.toggle("hidden", v !== "range");
      document.querySelectorAll("#dateType .chip").forEach((chip) => {
        const input = chip.querySelector("input");
        chip.classList.toggle("active", input && input.checked);
      });
    }

    function renderBench(filter = "") {
      const q = filter.trim();
      const box = document.getElementById("benchList");
      box.innerHTML = "";
      allInstitutions.filter((n) => !q || n.includes(q)).forEach((name) => {
        const lab = document.createElement("label");
        lab.innerHTML = `<input type="checkbox" value="${name}" /> ${name}`;
        box.appendChild(lab);
      });
    }

    function selectedBenches() {
      return [...document.querySelectorAll("#benchList input:checked")].map((x) => x.value);
    }

    async function init() {
      const meta = await fetch(API_BASE + "/api/meta").then((r) => {
        if (!r.ok) throw new Error("接口不可用");
        return r.json();
      });
      allInstitutions = meta.institutions || [];
      commonBenchmarks = meta.common_benchmarks || [];
      const ft = document.getElementById("fundType");
      (meta.fund_types || ["全部"]).forEach((x) => {
        const o = document.createElement("option");
        o.value = x; o.textContent = x; ft.appendChild(o);
      });
      ["singleDate", "startDate", "endDate"].forEach((id) => {
        document.getElementById(id).value = meta.today;
      });
      document.getElementById("heroMeta").textContent =
        `已加载 ${allInstitutions.length} 家对标机构 · 今日 ${meta.today}`;
      renderBench();
      log("服务已连接，可以开始勾选并爬取。");
    }

    document.getElementById("dateType").addEventListener("change", syncDateRows);
    document.getElementById("benchSearch").addEventListener("input", (e) => renderBench(e.target.value));
    document.getElementById("btnClear").onclick = () => {
      document.querySelectorAll("#benchList input").forEach((x) => (x.checked = false));
    };
    document.getElementById("btnCommon").onclick = () => {
      document.querySelectorAll("#benchList input").forEach((x) => {
        x.checked = commonBenchmarks.includes(x.value);
      });
      log("已勾选常用对标：" + commonBenchmarks.join("、"));
    };
    document.getElementById("etfFull").addEventListener("change", (e) => {
      document.getElementById("etfChip").classList.toggle("active", e.target.checked);
    });

    document.getElementById("btnRun").onclick = async () => {
      const btn = document.getElementById("btnRun");
      btn.disabled = true;
      statusEl.className = "status run";
      statusEl.textContent = "正在爬取…";
      logEl.textContent = "";
      const body = {
        date_type: selectedDateType(),
        single_date: document.getElementById("singleDate").value,
        start_date: document.getElementById("startDate").value,
        end_date: document.getElementById("endDate").value,
        fund_type: document.getElementById("fundType").value,
        benchmarks: selectedBenches(),
        etf_full_history: document.getElementById("etfFull").checked,
      };
      log("提交参数 " + JSON.stringify(body));
      try {
        const resp = await fetch(API_BASE + "/api/scrape", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!resp.ok) {
          let detail = await resp.text();
          try { detail = JSON.parse(detail).detail || detail; } catch (_) {}
          throw new Error(detail || ("HTTP " + resp.status));
        }
        const blob = await resp.blob();
        const cd = resp.headers.get("Content-Disposition") || "";
        let filename = "证监会网页数据.xlsx";
        const m = /filename\*?=(?:UTF-8'')?\"?([^\";]+)/i.exec(cd);
        if (m) filename = decodeURIComponent(m[1]);
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
        statusEl.className = "status ok";
        statusEl.textContent = "完成，已开始下载";
        log("完成：已下载 " + filename);
      } catch (e) {
        statusEl.className = "status err";
        statusEl.textContent = "失败";
        log("错误：" + (e && e.message ? e.message : e));
      } finally {
        btn.disabled = false;
      }
    };

    syncDateRows();
    init().catch((e) => {
      statusEl.className = "status err";
      statusEl.textContent = "服务未连接";
      log("初始化失败：" + e + "。请确认后端已启动。");
    });
  </script>
</body>
</html>
