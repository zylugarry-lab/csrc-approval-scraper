<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>产品宣传</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f1ea;
      --paper: #fffdf8;
      --ink: #1f2933;
      --muted: #62707c;
      --line: #e4ddd0;
      --accent: #0b57d0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    .wrap { max-width: 980px; margin: 0 auto; padding: 56px 20px 72px; }
    h1 { margin: 0 0 8px; font-size: 1.8rem; font-weight: 700; }
    .sub { margin: 0 0 28px; color: var(--muted); line-height: 1.6; }
    .back { color: var(--accent); font-weight: 700; text-decoration: none; font-size: 0.88rem; }
    .windows { display: grid; gap: 14px; margin-top: 22px; }
    @media (min-width: 720px) { .windows { grid-template-columns: 1fr 1fr; } }
    a.window {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 210px;
      padding: 22px 20px 18px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      color: inherit;
      text-decoration: none;
    }
    a.window:hover { border-color: #b9c7dc; }
    .tag {
      align-self: flex-start;
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      color: var(--accent);
      background: #e8f0fe;
      border-radius: 999px;
      padding: 3px 8px;
    }
    a.window h2 { margin: 4px 0 0; font-size: 1.15rem; }
    a.window p { margin: 0; color: var(--muted); font-size: 0.9rem; line-height: 1.55; flex: 1; }
    .go { font-size: 0.88rem; font-weight: 700; color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="../">返回入口</a>
    <h1>产品宣传</h1>
    <p class="sub">两个工具分开使用。文件都只在这台浏览器里处理，不会上传。</p>
    <div class="windows">
      <a class="window" href="https://zylugarry-lab.github.io/intro-baseline-review/">
        <span class="tag">一页通</span>
        <h2>要素与介绍核对</h2>
        <p>从合同提取要素，按底稿修订一页通，并生成海报。</p>
        <span class="go">进入</span>
      </a>
      <a class="window" href="https://zylugarry-lab.github.io/chanpin-xuanchuan-wuliao-fuhe/">
        <span class="tag">成品对照</span>
        <h2>物料复核</h2>
        <p>用 Word 稿对照 PDF 或图片成品，列出多字、漏字和费率差异。</p>
        <span class="go">进入</span>
      </a>
    </div>
  </div>
</body>
</html>
