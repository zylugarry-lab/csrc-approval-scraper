<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>修改意见</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f1ea;
      --paper: #fffdf8;
      --ink: #1f2933;
      --muted: #62707c;
      --line: #e4ddd0;
      --accent: #0b57d0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    .wrap { max-width: 820px; margin: 0 auto; padding: 40px 20px 72px; }
    h1 { margin: 14px 0 8px; font-size: 1.8rem; font-weight: 700; }
    .sub { margin: 0 0 22px; color: var(--muted); line-height: 1.65; }
    .back { color: var(--accent); font-weight: 700; text-decoration: none; font-size: 0.88rem; }
    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }
    label { display: block; font-size: 0.82rem; color: var(--muted); margin: 0 0 6px; }
    .grid { display: grid; gap: 12px; }
    @media (min-width: 640px) { .grid.two { grid-template-columns: 1fr 1fr; } }
    input, textarea {
      width: 100%;
      font: inherit;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 9px 12px;
    }
    textarea { min-height: 120px; resize: vertical; line-height: 1.6; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    button, .filebtn {
      border: 0;
      border-radius: 999px;
      padding: 8px 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .primary { background: var(--accent); color: #fff; }
    .ghost { background: #e8f0fe; color: var(--accent); }
    .danger { background: #fde8e8; color: #9b2c2c; }
    button:disabled { opacity: 0.45; cursor: default; }
    input[type="file"] { display: none; }
    #status { margin: 8px 0 0; color: var(--muted); font-size: 0.86rem; }
    #list { list-style: none; padding: 0; margin: 0; }
    #list li {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 10px;
    }
    .meta { color: var(--muted); font-size: 0.82rem; margin: 0 0 8px; }
    .body { white-space: pre-wrap; line-height: 1.65; }
    .actions { display: flex; gap: 10px; margin-top: 10px; }
    .actions button { padding: 5px 12px; font-size: 0.82rem; }
    .empty { color: var(--muted); padding: 8px 2px; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="../">返回入口</a>
    <h1>修改意见</h1>
    <p class="sub">给同事留意见：点添加写入列表，点保存备份下载文件。意见留在这台电脑的浏览器里，不会上传。要给别人看，下载备份后发过去，对方用导入合并。</p>
    <div class="card">
      <div class="grid two">
        <div>
          <label for="author">姓名</label>
          <input id="author" type="text" placeholder="选填" autocomplete="name" />
        </div>
        <div>
          <label for="target">针对</label>
          <input id="target" type="text" placeholder="选填，例如说明书、某只产品" />
        </div>
      </div>
      <div style="margin-top:12px">
        <label for="body">意见</label>
        <textarea id="body" placeholder="写要改的地方。Ctrl + Enter 也可以添加。"></textarea>
      </div>
      <div class="row">
        <button id="add" class="primary" type="button">添加</button>
        <button id="save" class="ghost" type="button">保存备份</button>
        <button id="text" class="ghost" type="button">下载文本</button>
        <label class="filebtn ghost" for="import">导入备份</label>
        <input id="import" type="file" accept=".json,application/json" />
      </div>
      <p id="status"></p>
    </div>
    <ul id="list"></ul>
  </div>
  <script src="app.js"></script>
</body>
</html>
