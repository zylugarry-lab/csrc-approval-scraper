<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>说明书与风险揭示书</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <style>
    :root {
      --bg: #f4f1ea;
      --paper: #fffdf8;
      --ink: #1f2933;
      --muted: #62707c;
      --line: #e4ddd0;
      --accent: #0b57d0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    .wrap { max-width: 820px; margin: 0 auto; padding: 40px 20px 72px; }
    h1 { margin: 14px 0 8px; font-size: 1.8rem; font-weight: 700; }
    .sub { margin: 0 0 22px; color: var(--muted); line-height: 1.65; }
    .back { color: var(--accent); font-weight: 700; text-decoration: none; font-size: 0.88rem; }
    #drop {
      background: var(--paper);
      border: 1px dashed #c8bfb0;
      border-radius: 16px;
      padding: 28px 20px;
      text-align: center;
    }
    #drop.over { border-color: var(--accent); background: #f3f7ff; }
    #drop p { margin: 0 0 14px; color: var(--muted); }
    .filebtn, button {
      border: 0;
      border-radius: 999px;
      padding: 8px 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .filebtn { background: var(--accent); color: white; }
    button { background: #e8f0fe; color: var(--accent); }
    button:disabled { opacity: 0.45; cursor: default; }
    .row { display: flex; gap: 10px; margin: 16px 0 8px; }
    #status { color: var(--muted); line-height: 1.6; white-space: pre-wrap; }
    ul { list-style: none; padding: 0; margin: 12px 0 0; }
    li {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .name { font-weight: 700; }
    .links { display: flex; gap: 14px; margin-top: 8px; }
    .links a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .report { margin: 8px 0 0; color: var(--muted); font-size: 0.86rem; white-space: pre-wrap; }
    input[type="file"] { display: none; }
    .kind {
      display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center;
      margin: 0 0 16px; padding: 12px 14px;
      background: var(--paper); border: 1px solid var(--line); border-radius: 14px;
    }
    .kind legend { font-size: 0.78rem; color: var(--accent); font-weight: 700; padding: 0 6px; }
    .kind label { font-size: 0.92rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="../">返回入口</a>
    <h1>说明书与风险揭示书</h1>
    <p class="sub">上传集合或单一计划管理合同（.docx）。页面按合同章节生成说明书和风险揭示书初稿，文件只在这台浏览器里处理。单一用 22 行表，集合用 44 行表。抽不到的格子会写成「未从合同抽到」。业绩报酬里的公式和退出费分档表，下载后请对照合同。</p>
    <fieldset class="kind">
      <legend>计划类型</legend>
      <label><input type="radio" name="kind" value="auto" checked>按合同自动判断</label>
      <label><input type="radio" name="kind" value="集合">集合</label>
      <label><input type="radio" name="kind" value="单一">单一</label>
    </fieldset>
    <div id="drop">
      <p>把合同拖到这里，或点按钮选择，可以一次选多份。</p>
      <label class="filebtn" for="files">选择合同</label>
      <input id="files" type="file" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" multiple />
    </div>
    <div class="row">
      <button id="run" type="button" disabled>生成并下载</button>
      <button id="zip" type="button" hidden>再次下载压缩包</button>
    </div>
    <p id="status">正在准备。</p>
    <ul id="list"></ul>
  </div>
  <script src="app.js?v=2"></script>
</body>
</html>
