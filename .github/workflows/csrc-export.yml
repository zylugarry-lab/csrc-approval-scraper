name: 证监会审批导出

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: csrc-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 是否有待生成
        id: queue
        run: python3 webapp/drain_queue.py --peek

      - uses: actions/setup-python@v5
        if: steps.queue.outputs.pending == '1'
        with:
          python-version: "3.11"

      - name: 安装依赖
        if: steps.queue.outputs.pending == '1'
        working-directory: webapp
        run: pip install -r requirements.txt

      - name: 生成 Excel
        id: build
        if: steps.queue.outputs.pending == '1'
        run: python3 webapp/drain_queue.py

      - name: 提交结果
        if: steps.build.outputs.produced == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find approval/out -type f ! -name '.gitkeep' -mmin +1440 -delete
          git add -f approval/out
          git diff --cached --quiet || git commit -m "Publish approval export"
          git push

      - uses: actions/upload-pages-artifact@v3
        if: steps.build.outputs.produced == '1'
        with:
          path: .

      - id: deployment
        if: steps.build.outputs.produced == '1'
        uses: actions/deploy-pages@v4
