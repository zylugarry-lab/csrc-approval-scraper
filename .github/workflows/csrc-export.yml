name: 证监会审批导出

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: csrc-export
  cancel-in-progress: false

jobs:
  export:
    if: startsWith(github.event.issue.title, '审批导出')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Shanghai
      ISSUE_BODY: ${{ github.event.issue.body }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        working-directory: webapp
        run: pip install -r requirements.txt

      - name: 生成 Excel
        working-directory: webapp
        run: python github_export.py ../export-out

      - uses: actions/upload-artifact@v4
        with:
          name: csrc-export-${{ github.event.issue.number }}
          path: export-out/*
          if-no-files-found: error

      - name: 回写下载链接
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "$(cat <<EOF
          导出完成。

          下载 Excel：打开 [这次运行](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})，在页面底部 Artifacts 里下载 \`csrc-export-${{ github.event.issue.number }}\`。

          EOF
          )"
          gh issue close "${{ github.event.issue.number }}" --reason completed

      - name: 失败时回写
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "导出失败。打开 [这次运行](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) 查看日志。"
