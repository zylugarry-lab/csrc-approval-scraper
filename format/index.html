<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>格式刷新</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <style>
    :root {
      --bg: #f4f1ea;
      --paper: #fffdf8;
      --ink: #1f2933;
      --muted: #62707c;
      --line: #e4ddd0;
      --accent: #0b57d0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    .wrap { max-width: 820px; margin: 0 auto; padding: 40px 20px 72px; }
    h1 { margin: 14px 0 8px; font-size: 1.8rem; font-weight: 700; }
    .sub { margin: 0 0 22px; color: var(--muted); line-height: 1.65; }
    .back { color: var(--accent); font-weight: 700; text-decoration: none; font-size: 0.88rem; }
    #drop {
      background: var(--paper);
      border: 1px dashed #c8bfb0;
      border-radius: 16px;
      padding: 28px 20px;
      text-align: center;
    }
    #drop.over { border-color: var(--accent); background: #f3f7ff; }
    #drop p { margin: 0 0 12px; color: var(--muted); }
    button, .filebtn {
      appearance: none;
      border: 0;
      background: var(--accent);
      color: white;
      font: inherit;
      font-weight: 700;
      border-radius: 999px;
      padding: 8px 16px;
      cursor: pointer;
    }
    button[disabled] { opacity: 0.45; cursor: default; }
    #zip { background: #1f2933; margin-left: 8px; }
    .row { display: flex; gap: 8px; align-items: center; margin-top: 16px; }
    #status { margin: 14px 0; color: var(--muted); line-height: 1.5; }
    ul { list-style: none; padding: 0; margin: 0; }
    li {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      align-items: center;
    }
    li span:first-child { flex: 1; min-width: 180px; }
    .state { color: var(--accent); font-size: 0.88rem; }
    li a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .err { flex-basis: 100%; color: #9b2c2c; font-size: 0.86rem; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="../simu/">返回私募</a>
    <h1>格式刷新</h1>
    <p class="sub">批量上传说明书、合同或风险揭示书。正文改为宋体小四、1.5 倍行距并顶格，表格改为五号、单倍行距，清掉高亮。文件只在这台浏览器里处理，不会上传。多份会打成一个压缩包下载。</p>
    <div id="drop">
      <p>把 .docx 拖到这里，或点按钮选择，可以一次选多份。</p>
      <label class="filebtn" for="files">选择 Word</label>
      <input id="files" type="file" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" multiple />
    </div>
    <div class="row">
      <button id="run" type="button" disabled>开始刷新</button>
      <button id="zip" type="button" hidden>再次下载压缩包</button>
    </div>
    <p id="status">正在准备。</p>
    <ul id="list"></ul>
  </div>
  <script src="app.js"></script>
</body>
</html>
