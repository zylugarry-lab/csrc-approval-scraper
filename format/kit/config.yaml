# =============================================================================
# 私募文档格式一键刷新 — 排版规格
# 改这里即可，不必改代码。字号可写「小四」「五号」或数字（磅）。
# =============================================================================

body:
  font_east_asia: 宋体
  font_ascii: Times New Roman
  size: 小四                 # 12 磅
  color: "000000"            # 黑色
  alignment: left            # 左对齐（不要两端对齐、不要居中）
  first_line_chars: 0        # 全部顶格，不要首行缩进
  line_spacing_rule: auto    # auto=倍数, exact=固定值（磅）
  line_spacing: 1.5          # 1.5 倍行距
  space_before_pt: 0
  space_after_pt: 0

table:
  font_east_asia: 宋体
  font_ascii: Times New Roman
  size: 五号                 # 表格内略小，与说明书习惯一致；若要与正文相同可改成 小四
  color: "000000"
  alignment: left            # 表格内默认左对齐（短标签更整齐）
  first_line_chars: 0        # 表格内正文顶格，避免单元格里参差不齐
  line_spacing_rule: auto
  line_spacing: 1.0          # 表格内单倍行距，减少空洞
  space_before_pt: 0
  space_after_pt: 0

# 全部顶格：编号也不做悬挂、不缩进。
lists:
  cn1:        { left: 0, hanging: 0 }
  cn2:        { left: 0, hanging: 0 }
  num_dot:    { left: 0, hanging: 0 }
  num_paren:  { left: 0, hanging: 0 }
  circled:    { left: 0, hanging: 0 }
  extra_left_chars: 0

header_footer:
  font_east_asia: 宋体
  font_ascii: Times New Roman
  size: 小五
  color: "000000"
  line_spacing: 1.0

options:
  process_body: true
  process_tables: true
  process_headers_footers: true
  process_textboxes: true
  clear_highlight: true              # 清除字体突出显示（修订残留的黄/青高亮）
  clear_run_shading: true            # 清除字符底纹（看起来像高亮）
  preserve_bold: true                # 保留加粗（章节名、表头）
  preserve_italic: true
  preserve_underline: true
  preserve_super_sub: true           # 保留上标/下标
  strip_leading_whitespace: true     # 去掉用空格/全角空格/Tab 假装出来的缩进
  collapse_empty_in_tables: true     # 折叠表格里连续空段（截图中的大块空白）
  disable_document_grid: true        # 关闭文档网格，否则行距设置不生效
  flush_all: true                    # 所有段落顶格（取消首行缩进、左缩进、悬挂缩进）
  protect_formula_layout: true       # 保留分段函数大括号等公式小表的缩进和行距
  center_cover: true                 # 封面标题、年份居中（其余仍左对齐顶格）
  center_page_numbers: true          # 页脚页码居中
  bold_table_labels: true            # 「投资范围」「名称」等字段名加粗
  fit_cells: true                    # 单元格自动贴合：顶端对齐、去掉多余行高
  normalize_formulas: true           # 分段函数大括号小表：纵向合并、两行条件对齐
  skip_right_aligned: true           # 页眉页码等右对齐段落：只改字体/行距，保持右对齐
  preserve_centered_size: false
  remove_auto_num_if_text_has_marker: true  # 段首已有「1、」时去掉 Word 自动编号，避免双重缩进
